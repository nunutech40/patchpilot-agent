services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-2026.5.20}
    image: patchpilot/openclaw:${OPENCLAW_VERSION:-2026.5.20}
    container_name: patchpilot-openclaw
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PATCHPILOT_GATEWAY_PORT:-18889}:18889"
    volumes:
      - patchpilot_openclaw:/home/patchpilot/.openclaw
      - patchpilot_workspace:/workspace
    mem_limit: 768m
    cpus: "1.50"
    security_opt:
      - no-new-privileges:true
    networks:
      - patchpilot_net

networks:
  patchpilot_net:
    name: patchpilot_net

volumes:
  patchpilot_openclaw:
    name: patchpilot_openclaw
  patchpilot_workspace:
    name: patchpilot_workspace
